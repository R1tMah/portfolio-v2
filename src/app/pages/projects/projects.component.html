<!-- src/app/pages/projects/projects.component.html -->

<!-- 1) Type‑writer heading -->
<div class="typewriter-container">
  <h2 class="typewriter-heading">These are my projects</h2>
</div>
<div class="typewriter-full">
  <span class="line1">
    These are all the projects I've completed over Full-Stack and Machine Learning
  </span>
</div>

<div class="projects-layout">
  <!-- 2) Year sidebar -->
  <nav class="year-sidebar" aria-label="Filter projects by year">
    <button
      type="button"
      class="year-item"
      [class.active]="selectedYear === 'All'"
      [attr.aria-pressed]="selectedYear === 'All'"
      (click)="selectYear('All')">
      <span class="year-label">All</span>
      <span class="year-count">{{ projects.length }}</span>
    </button>
    <button
      *ngFor="let group of yearGroups"
      type="button"
      class="year-item"
      [class.active]="selectedYear === group.year"
      [attr.aria-pressed]="selectedYear === group.year"
      (click)="selectYear(group.year)">
      <span class="year-label">{{ group.year }}</span>
      <span class="year-count">{{ group.projects.length }}</span>
    </button>
  </nav>

  <div class="year-sections">
    <section *ngFor="let group of visibleGroups" class="year-section">
      <h3 class="year-heading">{{ group.year }}</h3>

<!-- 3) Projects grid -->
<div class="projects-grid">
  <mat-card *ngFor="let project of group.projects" class="project-card" (click)="openDetails(project)">
    
    <!-- Card header -->
    <mat-card-header>
      <mat-card-title>{{ project.title }}</mat-card-title>
    </mat-card-header>

    <!-- Card body -->
    <mat-card-content>

      <!-- Bullets -->
      <p class="summary">{{ project.bullets[0] }}</p>


      <!-- Skills chips -->
      <mat-chip-set class="skill-chips">
        <mat-chip *ngFor="let skill of project.skills">{{ skill }}</mat-chip>
      </mat-chip-set>

    </mat-card-content>

    <mat-card-actions align="end">
    <button mat-button (click)="openDetails(project); $event.stopPropagation()">
      <mat-icon>info</mat-icon> Details
    </button>
  </mat-card-actions>
    <!-- Card actions (wire up real links when you’re ready) -->
    <mat-card-actions align="end">
      <button mat-button>
        <mat-icon>code</mat-icon>     <a
      *ngIf="project.repoUrl"
      class="github-link"
      [href]="project.repoUrl"
      target="_blank"
      rel="noopener noreferrer"
    >
      <!-- you can swap this for a Material icon or an <img> -->
      
      View Code
    </a>
      </button>
    </mat-card-actions>

  </mat-card>
</div>
    </section>
  </div>
</div>
